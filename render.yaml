services:
  - type: web
    name: trinetra-backend-api
    runtime: python
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: USE_SQLITE_DEV
        value: "true"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./trinetra_prod.db
      - key: API_CORS_ORIGINS
        value: '["*"]'
      - key: gemine_api
        value: AIzaSyABa3a_DnI8QIpLJ1XcLZGLVizoIQJ5SBs
